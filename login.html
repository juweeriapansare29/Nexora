<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Nexora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      height: 72px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #111827;
    }

    .back-home {
      text-decoration: none;
      color: #374151;
      font-size: 15px;
      font-weight: 600;
    }

    .back-home:hover {
      color: #111827;
    }

    .login-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
    }

    .login-box {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      font-size: 30px;
      color: #111827;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #111827;
    }

    .password-box {
  position: relative;
}

.password-box input {
  padding-right: 45px;
}

.password-box button {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 18px;
  padding: 4px;
}

    .login-button {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-button:hover {
      background: #1f2937;
    }

    .login-button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .register-link {
      text-align: center;
      margin-top: 22px;
      color: #6b7280;
      font-size: 14px;
    }

    .register-link a {
      color: #111827;
      font-weight: 600;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .navbar {
        padding: 0 5%;
      }

      .login-box {
        padding: 30px 22px;
      }

      .login-header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="logo">Nexora</div>

    <a href="index.html" class="back-home">
      Back to Home
    </a>
  </header>


  <main class="login-container">

    <div class="login-box">

      <div class="login-header">
        <h1>Welcome Back</h1>

        <p>
          Login to your Nexora account to continue shopping
          and manage your orders.
        </p>
      </div>


      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>


        <div class="form-group">
  <label for="password">Password</label>

  <div class="password-box">
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="button" id="togglePassword">👁️</button>
  </div>
</div>


        <button type="submit" class="login-button" id="loginButton">
          Login
        </button>

      </form>

      <div id="message" class="message"></div>


      <div class="register-link">
        Don't have an account?
        <a href="register.html">Create an account</a>
      </div>

    </div>

  </main>


  <footer>
    Nexora — Cloud-Based Smart E-Commerce and Order Management System
  </footer>


  <script type="module">

    import { signInWithEmailAndPassword } from "firebase/auth";
import { doc, getDoc } from "firebase/firestore";
import { auth, db } from "./firebase-config.js";


    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", function() {

  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    togglePassword.textContent = "🙈";
  } else {
    passwordInput.type = "password";
    togglePassword.textContent = "👁️";
  }

});


    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;


      message.className = "message";
      message.textContent = "";

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";


      try {

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user = userCredential.user;

console.log("Firebase login successful:", user.email);

const userDoc = await getDoc(
  doc(db, "users", user.uid)
);

let role = "customer";

if (userDoc.exists()) {
  role = userDoc.data().role || "customer";
}

localStorage.setItem("nexoraUser", JSON.stringify({
  uid: user.uid,
  email: user.email,
  role: role
}));

console.log("Nexora user role:", role);

message.textContent =
  "Login successful. Welcome to Nexora!";

message.className = "message success";

setTimeout(function() {

  if (role === "manager") {
    window.location.href = "manager-dashboard.html";

  } else if (role === "employee") {
    window.location.href = "employee-dashboard.html";

  } else {
    window.location.href = "index.html";
  }

}, 1200);

      } catch (error) {

        console.error("Login error:", error);


        if (error.code === "auth/invalid-credential") {

          message.textContent =
            "Invalid email or password.";

        } else if (error.code === "auth/user-not-found") {

          message.textContent =
            "No account found with this email.";

        } else if (error.code === "auth/wrong-password") {

          message.textContent =
            "Incorrect password.";

        } else if (error.code === "auth/invalid-email") {

          message.textContent =
            "Please enter a valid email address.";

        } else {

          message.textContent =
            "Login failed. Please try again.";

        }

        message.className = "message error";

        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }

    });

  </script>
<script type="module" src="./nexora-chatbot.js"></script>
</body>
</html>
